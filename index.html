<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NEON-BAGGER-SHOW</title>
  <style>
    :root { --neon:#F7FF00; --glow:rgba(247,255,0,0.55); }
    *{ box-sizing:border-box } html,body{ height:100% }
    body{ margin:0; background:#000; color:var(--neon); font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; text-shadow:0 0 6px var(--glow); overflow:hidden }
    header{ position:relative; z-index:10; display:flex; justify-content:space-between; align-items:center; padding:16px 24px }
    .grid{ position:relative; z-index:10; display:grid; grid-template-columns:360px 1fr; gap:24px; padding:0 24px 64px }
    aside.panel{ transition:opacity .3s, transform .3s }
    .card{ border:1px solid var(--neon); border-radius:24px; background:rgba(247,255,0,0.06); box-shadow:0 0 18px var(--glow) inset, 0 0 20px var(--glow); padding:16px }
    .stage{ border:1px solid var(--neon); border-radius:24px; background:rgba(247,255,0,0.04); box-shadow:0 0 30px var(--glow) inset, 0 0 24px var(--glow); padding:24px }
    .boxes{ display:grid; grid-template-columns:repeat(3,1fr); gap:24px }
    .box{ border:1px solid var(--neon); border-radius:24px; background:#0a0a0a; box-shadow:0 0 24px var(--glow) inset, 0 0 18px var(--glow); padding:16px }
    textarea{ width:100%; border-radius:14px; padding:10px; outline:none; background:#000; color:var(--neon); border:1px solid var(--neon); box-shadow:0 0 12px var(--glow) inset; resize:vertical }
    button.neon{ padding:8px 12px; border-radius:12px; border:1px solid var(--neon); background:transparent; color:var(--neon); box-shadow:0 0 12px var(--glow) inset, 0 0 12px var(--glow); cursor:pointer }
    footer{ position:relative; z-index:10; text-align:center; padding:18px 0; opacity:.8; font-size:12px; letter-spacing:2px }
    .bagger-field{ position:absolute; inset:0; overflow:hidden; pointer-events:none }
    .bagger-field>div{ position:absolute }
    .megabagger{ position:fixed; left:-30vw; width:25vw; z-index:5; filter:drop-shadow(0 0 24px rgba(247,255,0,0.95)); animation:passby 5s linear 0s 1 forwards }
    .flash{ position:fixed; inset:0; background:var(--neon); opacity:0; pointer-events:none; z-index:9999; mix-blend-mode:screen; transition:opacity 120ms ease-out }
    .spin{ animation:spin linear infinite } .blink{ animation:blink 1.1s steps(2,end) infinite } .shake{ animation:shake .2s infinite }
    .particle{ position:fixed; border-radius:2px; pointer-events:none; border:1px solid var(--neon); background:#000; box-shadow:0 0 10px var(--glow); animation:particle .6s ease-out forwards }
    @keyframes blink{ 50%{opacity:.35} } @keyframes spin{ to{ transform:rotate(360deg) } }
    @keyframes floatY{ from{ transform:translateY(0) } to{ transform:translateY(12px) } }
    @keyframes floatX{ from{ transform:translateX(0) } to{ transform:translateX(10px) } }
    @keyframes passby{ from{ transform:translateX(0vw) } to{ transform:translateX(130vw) } }
    @keyframes shake{ 0%,100%{ transform:translate(0,0) rotate(0deg) } 25%{ transform:translate(1px,.5px) rotate(.2deg) } 50%{ transform:translate(-1px,-.5px) rotate(-.2deg) } 75%{ transform:translate(.8px,-.8px) rotate(.1deg) } }
    @keyframes particle{ from{ opacity:1; transform:translate(0,0) } to{ opacity:0; transform:translate(12px,-24px) } }
    @media (max-width:980px){ .grid{ grid-template-columns:1fr } }
  </style>
</head>
<body>
  <div id="flash" class="flash"></div>
  <div id="baggerField" class="bagger-field"></div>

  <header>
    <h1 style="margin:0; font-weight:900; letter-spacing:2px;">NEON-BAGGER-SHOW</h1>
    <div style="display:flex; gap:8px;">
      <button id="shareBtn" class="neon" title="Teilen-Link kopieren">🔗 Teilen</button>
      <button id="togglePanel" class="neon">⚙️ Einstellungen</button>
    </div>
  </header>

  <main class="grid">
    <aside id="panel" class="panel">
      <div class="card">
        <div style="font-size:12px; font-weight:700; letter-spacing:2px; margin-bottom:8px;">Einstellungs-Menü</div>

        <label style="font-size:12px; letter-spacing:1px;">Anzeige-Text</label>
        <textarea id="textInput" rows="4">MEGA NEONGELB! VIELE BAGGER! ✦ ✦ ✦</textarea>

        <div style="height:10px"></div>
        <label style="font-size:12px; letter-spacing:1px;">Dreh-Speed</label>
        <input id="speedRange" type="range" min="1" max="27" value="18" style="width:100%">
        <div style="font-size:12px;">Aktuell: <b id="speedVal">18</b></div>

        <div style="height:10px"></div>
        <label style="font-size:12px; letter-spacing:1px;">Bagger-Menge</label>
        <input id="countRange" type="range" min="8" max="140" value="64" style="width:100%">
        <div style="font-size:12px;">Aktuell: <b id="countVal">64</b></div>

        <div style="height:10px"></div>
        <label style="font-size:12px; letter-spacing:1px;">Lautstärke</label>
        <input id="volRange" type="range" min="0" max="1" step="0.01" value="0.90" style="width:100%">
        <div style="display:flex; gap:8px; align-items:center; font-size:12px; margin-top:6px;">
          <span>Pegel: <b id="volVal">90%</b></span>
          <button id="muteBtn" class="neon">🔊 Laut</button>
        </div>
      </div>
    </aside>

    <section style="display:grid; gap:24px;">
      <div class="stage">
        <div style="position:relative; width:100%; display:flex; justify-content:center;">
          <svg id="circleSvg" class="spin" width="420" height="420" viewBox="0 0 200 200">
            <defs><path id="circlePath" d="M100,100 m-80,0 a80,80 0 1,1 160,0 a80,80 0 1,1 -160,0" /></defs>
            <text fill="var(--neon)" style="filter: drop-shadow(0 0 6px var(--glow)) drop-shadow(0 0 12px var(--glow));">
              <textPath id="circleText" href="#circlePath" startOffset="0%" textLength="502">
                NEON-BAGGER-POWER ✦ NEON-BAGGER-POWER ✦ NEON-BAGGER-POWER ✦ NEON-BAGGER-POWER ✦ NEON-BAGGER-POWER ✦ NEON-BAGGER-POWER ✦
              </textPath>
            </text>
          </svg>
          <div class="blink" style="position:absolute; text-align:center; padding:12px 18px; border-radius:16px;
                      color:#111; background:var(--neon); box-shadow:0 0 16px var(--glow), 0 0 32px var(--glow);">
            BLINKT & DREHT
          </div>
        </div>
      </div>

      <div class="boxes">
        <div class="box"><div style="font-size:12px; letter-spacing:2px; margin-bottom:6px;">Großer Kasten 1</div>
          <textarea id="box1" rows="8" placeholder="Schreibe hier deinen grellen Text…"></textarea></div>
        <div class="box"><div style="font-size:12px; letter-spacing:2px; margin-bottom:6px;">Großer Kasten 2</div>
          <textarea id="box2" rows="8" placeholder="Schreibe hier deinen grellen Text…"></textarea></div>
        <div class="box"><div style="font-size:12px; letter-spacing:2px; margin-bottom:6px;">Großer Kasten 3</div>
          <textarea id="box3" rows="8" placeholder="Schreibe hier deinen grellen Text…"></textarea></div>
      </div>
    </section>
  </main>

  <footer>MAXIMAL NEONGELB. MAXIMAL BAGGER. ✦</footer>

  <div id="flashOverlay" class="flash"></div>

  <script>
    // ===== Kurz-Helper
    const $ = (s) => document.querySelector(s);
    const NEON = getComputedStyle(document.documentElement).getPropertyValue('--neon');

    // ===== Share-State: URL-Hash (Base64) + localStorage
    const STORAGE_KEY = 'neon-bagger-state-v1';
    function encodeState(obj){
      const json = JSON.stringify(obj);
      return btoa(unescape(encodeURIComponent(json))); // Base64
    }
    function decodeState(b64){
      try{ return JSON.parse(decodeURIComponent(escape(atob(b64)))); }catch(e){ return null; }
    }
    function readHashState(){
      const m = location.hash.match(/[#&]d=([^&]+)/);
      return m ? decodeState(m[1]) : null;
    }
    function writeHashState(obj){
      const b64 = encodeState(obj);
      const url = location.origin + location.pathname + '#d=' + b64;
      history.replaceState(null,'',url);
      return url;
    }
    function saveLocal(obj){
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(obj)); }catch(e){}
    }
    function readLocal(){
      try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)||'null'); }catch(e){ return null; }
    }

    // ===== Audio (wie vorher, gekürzt)
    const audio = (() => {
      let ctx, master, gravelBus, engine=null, volume=0.9, muted=false;
      const ensure=()=>{ if(!ctx){ const Ctx=window.AudioContext||window.webkitAudioContext; ctx=new Ctx();
        master=ctx.createGain(); master.gain.value=muted?0:volume; master.connect(ctx.destination);
        gravelBus=ctx.createGain(); gravelBus.gain.value=0; gravelBus.connect(master);} return ctx; };
      const noiseBuf=(type='brown')=>{ const c=ensure(),len=c.sampleRate*2,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0); let last=0;
        for(let i=0;i<len;i++){ const w=Math.random()*2-1; if(type==='brown'){ d[i]=(last+0.02*w)/1.02; last=d[i]; d[i]*=3.5;} else d[i]=w; } return buf; };
      const playClank=()=>{ const c=ensure(); if(c.state==='suspended') c.resume(); const now=c.currentTime;
        const out=c.createGain(); out.connect(master);
        const n=c.createBufferSource(); n.buffer=noiseBuf('white'); const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=4000; bp.Q.value=5; n.connect(bp).connect(out);
        out.gain.setValueAtTime(0,now); out.gain.linearRampToValueAtTime(1,now+0.01); out.gain.exponentialRampToValueAtTime(0.001,now+0.25);
        const o=c.createOscillator(),og=c.createGain(); o.type='triangle'; o.frequency.setValueAtTime(800,now); o.frequency.exponentialRampToValueAtTime(200,now+0.2);
        og.gain.setValueAtTime(0.6,now); og.gain.exponentialRampToValueAtTime(0.001,now+0.22); o.connect(og).connect(out);
        n.start(now); n.stop(now+0.3); o.start(now); o.stop(now+0.24); };
      const startEngine=(f=38)=>{ const c=ensure(); if(c.state==='suspended') c.resume(); if(engine) return;
        const n=c.createBufferSource(); n.buffer=noiseBuf('brown'); n.loop=true;
        const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=320;
        const o=c.createOscillator(); o.type='sawtooth'; o.frequency.value=f;
        const g=c.createGain(); g.gain.value=0.5; n.connect(lp).connect(g); o.connect(g); g.connect(master);
        n.start(); o.start(); const l=c.createOscillator(),lg=c.createGain(); l.frequency.value=3.2; lg.gain.value=12; l.connect(lg).connect(o.frequency); l.start();
        engine={n,o,g}; };
      const rampEngine=(to=90,dur=2.0)=>{ if(!ctx||!engine) return; const now=ctx.currentTime; const F=engine.o.frequency; F.cancelScheduledValues(now); F.setValueAtTime(F.value,now); F.exponentialRampToValueAtTime(to,now+dur); };
      const stopEngine=()=>{ if(!ctx||!engine) return; const now=ctx.currentTime; const gg=engine.g.gain; gg.cancelScheduledValues(now); gg.setValueAtTime(gg.value,now); gg.exponentialRampToValueAtTime(0.0001,now+0.15);
        setTimeout(()=>{ try{engine.n.stop()}catch{} try{engine.o.stop()}catch{} engine=null; },180); };
      const gravelBurst=()=>{ const c=ensure(); if(c.state==='suspended') c.resume(); const now=c.currentTime;
        const src=c.createBufferSource(); src.buffer=noiseBuf('white'); const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=900; bp.Q.value=0.8; const g=c.createGain(); g.gain.value=0;
        src.connect(bp).connect(g).connect(gravelBus); g.gain.setValueAtTime(0.001,now); g.gain.linearRampToValueAtTime(0.9,now+0.03); g.gain.exponentialRampToValueAtTime(0.001,now+0.28);
        gravelBus.gain.setValueAtTime(0.8,now); gravelBus.gain.exponentialRampToValueAtTime(0.001,now+0.3); src.start(now); src.stop(now+0.35); };
      const setVolume=(v)=>{ volume=v; if(master) master.gain.value = muted?0:volume; };
      const setMuted=(m)=>{ muted=m; if(master) master.gain.value = muted?0:volume; };
      return { playClank,startEngine,rampEngine,stopEngine,gravelBurst,setVolume,setMuted };
    })();

    // ===== Bagger-SVG / Partikel
    function baggerSVG(size=48){
      const svgNS="http://www.w3.org/2000/svg"; const s=document.createElementNS(svgNS,"svg");
      s.setAttribute("width",size); s.setAttribute("height",size); s.setAttribute("viewBox","0 0 100 100");
      s.innerHTML = `
        <path d="M78 58 C88 52, 94 56, 96 64 C98 72, 92 78, 84 76 C76 74, 74 64, 78 58 Z" fill="${NEON}" stroke="#111" stroke-width="2"/>
        <rect x="58" y="44" width="8" height="22" rx="3" fill="${NEON}" stroke="#111" stroke-width="2"/>
        <rect x="64" y="52" width="10" height="8" rx="2" fill="${NEON}" stroke="#111" stroke-width="2"/>
        <rect x="20" y="36" width="28" height="20" rx="3" fill="${NEON}" stroke="#111" stroke-width="2"/>
        <rect x="24" y="40" width="12" height="10" rx="2" fill="#111" stroke="${NEON}" stroke-width="1"/>
        <rect x="16" y="56" width="60" height="12" rx="3" fill="${NEON}" stroke="#111" stroke-width="2"/>
        <rect x="12" y="70" width="64" height="10" rx="5" fill="${NEON}" stroke="#111" stroke-width="2"/>
        <circle cx="24" cy="75" r="4" fill="#111"/><circle cx="38" cy="75" r="4" fill="#111"/>
        <circle cx="52" cy="75" r="4" fill="#111"/><circle cx="66" cy="75" r="4" fill="#111"/>
      `;
      s.style.filter="drop-shadow(0 0 10px rgba(247,255,0,0.95))"; return s;
    }
    function spawnParticle(x,y){
      const el=document.createElement('span'); const size=3+Math.random()*4;
      el.className='particle'; el.style.left=x+'px'; el.style.top=y+'px'; el.style.width=size+'px'; el.style.height=size+'px';
      document.body.appendChild(el); setTimeout(()=>el.remove(),700);
    }

    // ===== Interaktives Feld
    const field = $('#baggerField');
    function buildField(count=64){
      field.innerHTML='';
      for(let i=0;i<count;i++){
        const wrap=document.createElement('div');
        wrap.style.left = Math.random()*100+'%'; wrap.style.top  = Math.random()*100+'%';
        const dur=6+Math.random()*10, del=Math.random()*5;
        wrap.style.animation = `floatY ${dur}s ease-in-out ${del}s infinite alternate, floatX ${dur*1.2}s ease-in-out ${del/2}s infinite alternate`;

        const inner=document.createElement('div'); inner.style.pointerEvents='auto';
        const s=32+Math.random()*40; const svg=baggerSVG(s); inner.appendChild(svg);

        let dragging=false;
        inner.addEventListener('pointerdown',(e)=>{ dragging=true; inner.setPointerCapture(e.pointerId);
          audio.startEngine(); audio.playClank(); if(navigator.vibrate) navigator.vibrate([10,20,10]); inner.classList.add('shake'); spawnParticle(e.clientX,e.clientY); });
        inner.addEventListener('pointermove',(e)=>{ if(!dragging) return; audio.gravelBurst(); spawnParticle(e.clientX+(Math.random()*14-7), e.clientY+(Math.random()*8-4)); });
        inner.addEventListener('pointerup',(e)=>{ dragging=false; audio.stopEngine(); inner.classList.remove('shake'); if(navigator.vibrate) navigator.vibrate(20); spawnParticle(e.clientX,e.clientY); });
        inner.addEventListener('click',(e)=>{ audio.playClank(); if(navigator.vibrate) navigator.vibrate(15); spawnParticle(e.clientX,e.clientY); });

        wrap.appendChild(inner); field.appendChild(wrap);
      }
    }

    // ===== Mega-Bagger + Flash
    const flashOverlay = $('#flashOverlay');
    function triggerFlash(){ flashOverlay.style.opacity=.6; setTimeout(()=>flashOverlay.style.opacity=0,280); }
    function spawnMegaBagger(){
      const y=10+Math.random()*70; const big=document.createElement('div'); big.className='megabagger'; big.style.top=y+'%';
      big.appendChild(baggerSVG(240)); big.addEventListener('animationend',()=>big.remove()); document.body.appendChild(big);
      triggerFlash(); audio.startEngine(50); audio.rampEngine(120,2.4); setTimeout(()=>audio.stopEngine(),5200);
    }
    setTimeout(spawnMegaBagger,0); setInterval(spawnMegaBagger,20000);

    // ===== UI Bindings
    const panel = $('#panel'); const toggle = $('#togglePanel'); let panelOpen=true;
    const setPanel=(open)=>{ panelOpen=open; panel.style.opacity=open?1:0; panel.style.transform=open?'translateX(0)':'translateX(-8px)'; panel.style.pointerEvents=open?'auto':'none'; }
    toggle.addEventListener('click',()=>setPanel(!panelOpen)); setPanel(true);

    const textInput=$('#textInput'), circleText=$('#circleText'), circleSvg=$('#circleSvg');
    const speedRange=$('#speedRange'), speedVal=$('#speedVal');
    const countRange=$('#countRange'), countVal=$('#countVal');
    const volRange=$('#volRange'), volVal=$('#volVal'), muteBtn=$('#muteBtn');
    const box1=$('#box1'), box2=$('#box2'), box3=$('#box3');

    function updateText(){ const base=(textInput.value&&textInput.value.trim().length>0)?textInput.value.trim():'NEON-BAGGER-POWER ✦'; circleText.textContent=Array(6).fill(base+' ').join(''); }
    function updateSpeed(){ const v=parseInt(speedRange.value,10); speedVal.textContent=v; circleSvg.style.animationDuration = Math.max(3,30-v)+'s'; }
    function updateCount(){ const c=parseInt(countRange.value,10); countVal.textContent=c; buildField(c); }
    function updateVol(){ const v=parseFloat(volRange.value); volVal.textContent=Math.round(v*100)+'%'; audio.setVolume(v); }

    // ===== Zustand serialisieren
    function getState(){
      return {
        text: textInput.value,
        speed: parseInt(speedRange.value,10),
        count: parseInt(countRange.value,10),
        volume: parseFloat(volRange.value),
        muted: muteBtn.textContent.includes('Stumm'),
        boxes: [box1.value, box2.value, box3.value]
      };
    }
    function setState(s){
      if(!s) return;
      if(typeof s.text==='string') textInput.value=s.text;
      if(typeof s.speed==='number') speedRange.value=s.speed;
      if(typeof s.count==='number') countRange.value=s.count;
      if(typeof s.volume==='number') volRange.value=s.volume;
      if(Array.isArray(s.boxes)){ box1.value=s.boxes[0]||''; box2.value=s.boxes[1]||''; box3.value=s.boxes[2]||''; }
      const muted = !!s.muted; audio.setMuted(muted); muteBtn.textContent = muted ? '🔇 Stumm' : '🔊 Laut';
      updateText(); updateSpeed(); updateCount(); updateVol();
    }

    // Lade-Priorität: URL-Hash > localStorage (falls kein Hash)
    const hashState = readHashState();
    if(hashState) setState(hashState); else { const local = readLocal(); if(local) setState(local); else { updateText(); updateSpeed(); updateCount(); updateVol(); } }

    // Debounce für Hash/Local-Updates
    let saveTimer=null;
    function scheduleSave(){
      if(saveTimer) cancelAnimationFrame(saveTimer);
      saveTimer = requestAnimationFrame(()=>{
        const state = getState();
        const url = writeHashState(state);
        saveLocal(state);
        // optional: nichts kopieren – nur URL aktualisieren
      });
    }

    // Inputs beobachten → speichern
    [textInput,speedRange,countRange,volRange,box1,box2,box3].forEach(el=>{
      el.addEventListener('input',()=>{ updateText(); updateSpeed(); updateCount(); updateVol(); scheduleSave(); });
    });

    // Mute-Toggle
    muteBtn.addEventListener('click', ()=>{
      const willMute = !muteBtn.textContent.includes('Stumm');
      audio.setMuted(willMute);
      muteBtn.textContent = willMute ? '🔇 Stumm' : '🔊 Laut';
      scheduleSave();
    });

    // Teilen-Button → Link in Zwischenablage
    $('#shareBtn').addEventListener('click', async ()=>{
      const url = writeHashState(getState());
      try{
        await navigator.clipboard.writeText(url);
        alert('Teilen-Link kopiert! Füge ihn irgendwo ein, um genau diesen Stand zu teilen.');
      }catch(e){
        prompt('Kopiere diesen Link:', url);
      }
    });
  </script>
</body>
</html>
